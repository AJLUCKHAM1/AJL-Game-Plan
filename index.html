<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BJJ Game Plans">
<title>BJJ Game Plans</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #0a0a0a;
    color: #f0ece3;
    font-family: 'Barlow', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: linear-gradient(160deg, #0d0d0d 0%, #0f0b0b 50%, #0a0d0f 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }

  .emoji { font-size: 3.5rem; margin-bottom: 20px; }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(2rem, 8vw, 3.4rem);
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.05;
    margin-bottom: 8px;
  }

  h1 span { color: #e63946; }

  .subtitle {
    font-family: 'Barlow Condensed', sans-serif;
    color: #333;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 52px;
    text-align: center;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 340px;
  }

  .player-card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 22px 24px;
    text-decoration: none;
    color: #f0ece3;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    border-left-width: 4px;
  }

  .player-card:active {
    transform: scale(0.98);
    background: rgba(255,255,255,0.06);
  }

  .player-card.dad  { border-left-color: #e63946; }
  .player-card.j    { border-left-color: #9b5de5; }

  .player-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.4rem;
    font-weight: 900;
    color: #0d0d0d;
    flex-shrink: 0;
  }

  .player-card.dad .player-avatar { background: #e63946; }
  .player-card.j   .player-avatar { background: #9b5de5; }

  .player-info { flex: 1; }

  .player-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 4px;
  }

  .player-card.dad .player-name { color: #e63946; }
  .player-card.j   .player-name { color: #9b5de5; }

  .player-sub {
    font-family: 'Barlow', sans-serif;
    font-size: 0.75rem;
    color: #444;
    letter-spacing: 0.04em;
  }

  .arrow {
    color: #2a2a2a;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .footer {
    margin-top: 52px;
    color: #1e1e1e;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="emoji">🥋</div>

  <h1>BJJ<br><span>Game Plans</span></h1>
  <div class="subtitle">Select your game plan</div>

  <div class="cards">

    <a href="dad.html" class="player-card dad">
      <div class="player-avatar">D</div>
      <div class="player-info">
        <div class="player-name">Dad</div>
        <div class="player-sub">Moves · Positions · Escapes</div>
      </div>
      <span class="arrow">›</span>
    </a>

    <a href="daughter.html" class="player-card j">
      <div class="player-avatar">J</div>
      <div class="player-info">
        <div class="player-name">J</div>
        <div class="player-sub">Moves · Positions · Escapes</div>
      </div>
      <span class="arrow">›</span>
    </a>

  </div>

  <div class="footer">Train hard · Flow with it · Trust your game</div>

</body>
</html>
